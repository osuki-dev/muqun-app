name: android apk

# Build the sideloadable Android APK and attach it to the GitHub release for
# the tag, so anyone can install Muqun without a store account.
#
# EAS --local compiles the `production-apk` profile on this runner using the
# existing Expo-managed signing credentials and dev.osuki.muqun package.
# Cross-channel updates also need matching APK/Play distribution certificates
# and increasing versionCode; verify Play App Signing before promising that.
# See release-notes/README.md for setup and signing verification.
#
# Requires one secret:
#
#   EXPO_TOKEN  a robot access token from https://expo.dev/settings/access-tokens

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to attach the APK to (blank = build only)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-apk-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        if: github.event_name == 'push' || inputs.tag != ''
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected vX.Y.Z'; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Validate release notes
        if: github.event_name == 'push' || inputs.tag != ''
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          test -s "release-notes/$RELEASE_TAG.md"
          node -e 'const {expo} = require("./app.json"); if (`v${expo.version}` !== process.env.RELEASE_TAG) throw new Error("Release tag must match app.json expo.version");'

      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        env:
          NODE_USE_ENV_PROXY: '1'
        run: bun install --frozen-lockfile

      - name: Build the APK locally on the runner
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          NODE_USE_ENV_PROXY: '1'
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::EXPO_TOKEN is not set. Add it under Settings -> Secrets -> Actions."
            exit 1
          fi
          # Same CLI and profile as the local release workflow. EAS supplies
          # existing managed credentials; compilation happens on this runner.
          bunx eas-cli@21.0.2 build \
            --platform android \
            --profile production-apk \
            --non-interactive \
            --local \
            --output muqun.apk

      - name: Checksum
        run: |
          set -euo pipefail
          test -s muqun.apk
          sha256sum muqun.apk > muqun.apk.sha256

      - name: Keep it on the run
        uses: actions/upload-artifact@v4
        with:
          name: muqun-apk
          path: |
            muqun.apk
            muqun.apk.sha256

      - name: Attach it to the release
        # Only when there is a tag to attach to: a manual run with no tag is a
        # build, and its APK is on the run above.
        if: github.event_name == 'push' || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: release-notes/${{ inputs.tag || github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            muqun.apk
            muqun.apk.sha256
