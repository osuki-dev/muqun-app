name: Feature request
description: Suggest something Muqun should be able to do.
labels: ["enhancement"]

# Deliberately shorter than the bug form.
#
# A bug report is triage and every field earns its place. A feature request is
# a conversation, and the fastest way to get none is to make someone fill in
# eight boxes before they can say the thing they came to say. Four questions,
# one of them optional.
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for the idea. The most useful requests describe a moment that
        actually happened to you — where you were, what you were trying to do,
        and what you did instead. A feature described that way often turns out
        to have a better answer than the one either of us started with.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation you are in, not only the feature you have in mind.
      placeholder: An agent blocked while I was on the train. I could see it was waiting, but the only way to answer was to get my laptop out.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like Muqun to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: How do you work around it today?
      description: Including "I don't, I just wait" — that is a real answer and it says how much this costs you.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - All of them
        - iPhone
        - iPad
        - Android
    validations:
      required: true

  - type: checkboxes
    id: offer
    attributes:
      label: Would you like to build it?
      description: >-
        Entirely optional, and a "no" costs the request nothing. It is here
        because a request and an offer are answered differently — an offer gets
        pointed at the right file.
      options:
        - label: I would be interested in opening a pull request for this
