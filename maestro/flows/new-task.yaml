# Starting an agent from the phone, and stopping one -- the whole of card #690's
# happy path, offline.
#
# What this flow can and cannot reach, and why:
#
#  * Both entries are gated on the gateway declaring `agent_spawn`. Demo mode
#    declares it and nothing else (`demoHealth` in `demo-gateway.ts`), which is
#    what puts the rows on screen here. The negative case -- an older gateway,
#    where neither row renders at all -- needs a pairing that cannot be produced
#    without a QR code, so it is a unit test (`agent-spawn.test.ts`, "the
#    capability gate") and is written out at the bottom of this file.
#  * The agent catalog is the gateway's. Offline it is `demoAgentProfiles`, four
#    kinds, one of them deliberately not on the host's PATH -- so the hint the
#    picker draws for an unavailable kind has something to draw, and the flow can
#    prove it is offered rather than hidden.
#  * The spawn answers with the demo's own Claude pane. Nothing is created: the
#    fixture session is a fixed five panes, and an id the next snapshot does not
#    contain is the one failure the panel picker's retry cannot recover from. So
#    "the phone landed on the pane the spawn named" is what is asserted, which is
#    exactly the promise the flow makes on a real gateway too.
#  * The home-card entry cannot be reached offline. It hangs off the capability
#    mirror, which is written per paired server; the demo record is transient and
#    never joins the server list, so there is no card to open a menu on. The
#    mirror's own rules are unit-tested (`server-capabilities.test.ts`).
#  * Dictation is the platform keyboard's and there is no app control for it, so
#    there is nothing here to drive. The prompt is typed.
appId: dev.osuki.muqun
name: new-task
# Untagged while AGENT_SPAWN_SHIPPED is false (Ellen held New Task back from
# 1.2.0): the entry points are hidden, so the gate cannot walk them. Restore
# the `full` tag alongside the constant.
tags: []
---
- runFlow: ../subflows/open-demo.yaml

# The demo opens on the Claude pane, which is the agent pane and is working --
# both facts matter below.
- assertVisible: "Claude Code"

# ── Both rows are in quick actions ────────────────────────────────────────
# New task sits above New panel and New tab: those two make an empty place to
# work, this one makes a place with the work already started in it. Stop is
# above all three and is only there because this pane's agent is working.
- tapOn: "Open quick actions"
- extendedWaitUntil:
    visible: "Close quick actions"
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 3000
- runFlow: ../subflows/dismiss-logbox.yaml
# Both rows are one accessible element each -- the card collapses its children,
# so the label is the whole of what a row exposes and its caption is not
# separately assertable. Matched in full, which is how Maestro matches: "Stop"
# alone would not match "Stop this agent".
- assertVisible: "New task"
- assertVisible: "Stop this agent"
- takeScreenshot: shots/70-quick-actions

# ── Stop sends one interrupt and leaves ───────────────────────────────────
# The sheet closes on success because the answer is behind it: the pane's own
# status is what says it worked. Driven first so the rest of the flow starts
# from the terminal again.
- tapOn: "Stop this agent"
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible: "Close quick actions"
- assertVisible: "Claude Code"

# ── New task replaces the sheet rather than stacking on it ────────────────
- runFlow: ../subflows/dismiss-logbox.yaml
- tapOn: "Open quick actions"
- extendedWaitUntil:
    visible: "Close quick actions"
    timeout: 8000
- tapOn: "New task"
- extendedWaitUntil:
    visible: "Close new task"
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 3000
- runFlow: ../subflows/dismiss-logbox.yaml
# Quick actions is gone, not underneath: the two sheets are two answers to one
# tap, and stacking them would leave Back pointing at a list nobody returns to.
- assertNotVisible: "Close quick actions"

# ── The three questions ───────────────────────────────────────────────────
- assertVisible: "AGENT"
- assertVisible: "DIRECTORY"
- assertVisible: "FIRST PROMPT"
# The catalog, including the kind this host has no executable for. It is dimmed
# and still tappable: Herdr resolves a kind to its own canonical executable, so
# "not on PATH" is a hint from the gateway and not a veto.
- extendedWaitUntil:
    visible: "claude"
    timeout: 8000
- assertVisible: "codex"
- assertVisible: "opencode"
- assertVisible: "gemini, not found on this server's PATH"
- takeScreenshot: shots/71-new-task

# The recent directories are a shortcut, and the field under them is always
# there -- a shortcut that hides the long way round is a trap the first time it
# does not have the place you meant.
- assertVisible: "~/code/herdr-gateway"
- assertVisible: "Leave it empty to start where the session already is."
- assertVisible: "Type it, or use your keyboard's dictation key."

# ── Answering them ────────────────────────────────────────────────────────
- tapOn: "codex"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: "~/code/herdr-gateway"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: "Review the failing test and fix it."
- inputText: "look at the failing scrollback test"
- waitForAnimationToEnd:
    timeout: 2000
- runFlow: ../subflows/dismiss-logbox.yaml
- takeScreenshot: shots/72-new-task-filled
# The keyboard's own Done, above it. The sheet is sized to its contents, so
# with the keyboard up there is no room left to scroll Go clear of it -- which
# is exactly why the toolbar is there, and why this is the tap a reader makes
# rather than a convenience for the test.
- tapOn: "Done"
- waitForAnimationToEnd:
    timeout: 2000

# ── Go, and the phone lands in the pane ───────────────────────────────────
# The whole promise of the flow: the sheet leaves and what is behind it is the
# pane the spawn named, not the pane the sheet was opened from.
- tapOn: "Start task"
- extendedWaitUntil:
    notVisible: "Close new task"
    timeout: 12000
- waitForAnimationToEnd:
    timeout: 4000
- runFlow: ../subflows/dismiss-logbox.yaml
- extendedWaitUntil:
    visible: "Claude Code"
    timeout: 10000
- takeScreenshot: shots/73-new-task-landed

# ── Closing without starting anything ─────────────────────────────────────
# The sheet's own close button, not a swipe: swiping a form sheet down races the
# sheet's gesture handler against the scroll view inside it.
- tapOn: "Open quick actions"
- extendedWaitUntil:
    visible: "Close quick actions"
    timeout: 8000
- tapOn: "New task"
- extendedWaitUntil:
    visible: "Close new task"
    timeout: 8000
- tapOn: "Close new task"
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible: "Close new task"
- assertVisible: "Claude Code"

# ── Not reachable offline ─────────────────────────────────────────────────
# Against a gateway that predates `agent_spawn`, the gate is that there is
# nothing to assert on -- no greyed row and no explanation:
#
#   - tapOn: "Open quick actions"
#   - assertVisible: "New terminal"        # the sheet is otherwise unchanged
#   - assertNotVisible: "New task"
#   - assertNotVisible: "Stop this agent"
#
# And on the home screen, with a paired server that has been opened once:
#
#   - tapOn: "More options for <server>"
#   - assertNotVisible: "New task on <server>"
#
# Neither is in the suite because demo mode declares the capability and a
# downgraded gateway cannot be paired offline.
