# ── Leave the device as it was found ──────────────────────────────────────
# Settings is a control in the home header now, not a drawer row (card #664).
- tapOn: 'Settings'
- extendedWaitUntil:
    visible: 'Color mode'
    timeout: 10000
- runFlow: ../subflows/dismiss-logbox.yaml
- tapOn:
    text: 'Theme, .*'
- extendedWaitUntil:
    visible: 'Osuki'
    timeout: 8000
- tapOn: 'Osuki'
- waitForAnimationToEnd:
    timeout: 1500
- extendedWaitUntil:
    visible: 'Theme, Osuki'
    timeout: 8000
- tapOn: 'SYSTEM'
- waitForAnimationToEnd:
    timeout: 1500
- assertVisible:
    text: 'SYSTEM'
    selected: true
