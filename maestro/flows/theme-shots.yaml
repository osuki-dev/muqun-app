# Every theme pack, both ways round: 192 screenshots in one pass.
#
# Thirty-two packs times light and dark is sixty-four combinations, each captured on
# the three screens where a palette is actually visible -- the settings picker,
# the server list, and the demo terminal, which is the only screen offline that
# shows the pack's ANSI sixteen.
#
# One launch, sixty-four switches, no relaunch in between. That is the second thing
# this run proves: the theme takes effect on the live app, and the screenshot
# after each switch is the evidence.
#
# Not tagged `smoke` or `full`: this is a screenshot run for review, not a gate.
# The gate for the picker lives in `settings.yaml`.
#
# Ends on Osuki in system mode, because the preference lives in SecureStore and
# SecureStore survives `clearState` -- a run that ended on Tokyo Night would
# hand the next one a starting state it did not choose (learned in i18n-shots).
appId: dev.osuki.muqun
name: theme-shots
---
- runFlow: ../subflows/launch-home.yaml

- runFlow:
    file: ../subflows/capture-theme.yaml
    env:
      THEME_LABEL: 'Osuki'
      MODE_LABEL: 'LIGHT'
      SHOT: 'osuki-light'
- runFlow:
    file: ../subflows/capture-theme.yaml
    env:
      THEME_LABEL: 'Osuki'
      MODE_LABEL: 'DARK'
      SHOT: 'osuki-dark'

