plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.muqunthemetransport'
version = '0.1.0'

dependencies {
  implementation 'com.squareup.okhttp3:okhttp:4.9.2'
  // Match expo-file-system's existing resolved Okio rather than introducing
  // OkHttp's older transitive 2.8.0 into this standalone module test target.
  implementation 'com.squareup.okio:okio:2.9.0'
  testImplementation 'junit:junit:4.13.2'
}

android {
  namespace "expo.modules.muqunthemetransport"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}
